name: validate_skills
permissions:
  contents: read

# Runs unconditionally on every PR and push to main -- deliberately NO `paths:`
# filter. `validate (3.12.0)` and `validate (dev)` are required status checks,
# and `test/readme_test.dart` validates root `README.md`.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [3.12.0, dev]
    defaults:
      run:
        working-directory: tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: ${{ matrix.sdk }}

      - run: dart pub get
        id: pub-get

      - run: dart analyze --fatal-infos
        if: always() && steps.pub-get.outcome == 'success'

      - run: dart format --output=none --set-exit-if-changed .
        if: always() && steps.pub-get.outcome == 'success' && matrix.sdk == 'dev'

      - run: dart test
        if: always() && steps.pub-get.outcome == 'success'
