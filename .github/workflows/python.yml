name: Python

# Runs unconditionally on every PR and push to main -- deliberately NO `paths:`
# filter, so these jobs can serve as required status checks.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs `ruff check` with the rules in ruff.toml. The version is pinned so
      # a new formatter release cannot turn main red on its own.
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.10"
      - run: ruff format --check --diff

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the floor the skill scripts promise.
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tool/test -p "*_test.py" -v
